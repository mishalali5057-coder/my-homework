<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071b2c"><title>جزيرة المغامرة 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b2c;color:white;font-family:system-ui,Tahoma;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;padding:13px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}.panel{background:#071b2cbb;border:1px solid #ffffff40;border-radius:15px;padding:10px 13px;backdrop-filter:blur(8px)}.sub{font-size:11px;color:#cde8f0}#score{font-weight:900;color:#ffe08a}.bottom{position:fixed;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:120px;height:120px;border-radius:50%;background:#dff8ff30;border:2px solid #ffffff80;position:relative;pointer-events:auto}#knob{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#e8fbffdd;border:2px solid white}.buttons{display:flex;gap:9px;pointer-events:auto}.action{width:66px;height:66px;border-radius:50%;border:2px solid white;background:#1769c7;color:white;font-weight:bold;touch-action:none}#jump{background:#0e8494}#start{position:fixed;inset:0;z-index:3;background:#061827eF;display:grid;place-items:center;padding:20px}.box{max-width:420px;text-align:center;background:#0c2940;border:1px solid #ffffff40;border-radius:24px;padding:25px}.box h1{font-size:27px;margin:5px}.box p{color:#c5e1eb;line-height:1.7;font-size:14px}#play{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#0ea5e9,#2563eb);color:white;font-weight:900;font-size:16px}#msg{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#071b2cee;border:1px solid #ffffff40;border-radius:13px;padding:10px;opacity:0;transition:.2s;white-space:nowrap}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head>
<body><div id="game"></div><div id="hud"><div class="panel"><b>🏝️ جزيرة المغامرة</b><div class="sub">استكشف واجمع البلورات</div></div><div class="panel"><div class="sub">البلورات</div><div id="score">💎 0 / 12</div></div></div><div id="msg"></div>
<div class="bottom"><div><div id="stick"><div id="knob"></div></div><div class="sub">حرّك للمشي</div></div><div class="buttons"><button class="action" id="jump">قفز</button><button class="action" id="turn">تدوير</button></div></div>
<div id="start"><div class="box"><div style="font-size:48px">🌴</div><h1>جزيرة المغامرة 3D</h1><p>عالم مفتوح صغير! تجوّل بين الأشجار والصخور، اقفز، واجمع 12 بلورة مخفية.</p><p><b>التحكم:</b> عصا الحركة أسفل اليسار، وزر القفز وتدوير الكاميرا.</p><button id="play">ابدأ المغامرة 🚀</button></div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd5ee);scene.fog=new THREE.Fog(0x8bd5ee,45,105);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf6ff,0x526b39,2));let sun=new THREE.DirectionalLight(0xffedc2,2.2);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
function height(x,z){return Math.max(-.2,1.2*Math.sin(x*.095)*Math.cos(z*.08)+.6*Math.sin(z*.17+x*.08))}
let water=new THREE.Mesh(new THREE.CircleGeometry(100,80),new THREE.MeshStandardMaterial({color:0x1686a4,roughness:.35}));water.rotation.x=-Math.PI/2;water.position.y=-1;scene.add(water);
let geo=new THREE.PlaneGeometry(78,78,90,90);geo.rotateX(-Math.PI/2);let p=geo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,height(p.getX(i),p.getZ(i)));geo.computeVertexNormals();let land=new THREE.Mesh(geo,material(0x69a94f));land.receiveShadow=true;scene.add(land);
const wood=material(0x80502c),green=material(0x237b55),green2=material(0x39975c),stone=material(0x788b91);
function tree(x,z,s){let y=height(x,z),tr=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.24*s,1.7*s,7),wood);tr.position.set(x,y+.85*s,z);tr.castShadow=true;scene.add(tr);for(let j=0;j<3;j++){let c=new THREE.Mesh(new THREE.ConeGeometry((1-j*.12)*s,1.7*s,7),j===1?green2:green);c.position.set(x,y+(1.8+j*.5)*s,z);c.castShadow=true;scene.add(c)}}
for(let i=0;i<75;i++){let a=Math.random()*6.28,r=8+Math.random()*28,x=Math.cos(a)*r,z=Math.sin(a)*r;tree(x,z,.65+Math.random()*.65)}
for(let i=0;i<22;i++){let a=Math.random()*6.28,r=7+Math.random()*29,x=Math.cos(a)*r,z=Math.sin(a)*r;let o=new THREE.Mesh(new THREE.DodecahedronGeometry(.5+Math.random()*.7),stone);o.position.set(x,height(x,z)+.35,z);o.scale.y=.7;o.castShadow=true;scene.add(o)}
let player=new THREE.Group();scene.add(player);let body=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.75,4,8),material(0x2563eb));body.position.y=1.1;body.castShadow=true;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),material(0xf2c9a5));head.position.y=1.85;player.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.35,12,8,0,6.28,0,1.7),material(0x30251f));hair.position.y=1.98;player.add(hair);
let gems=[],gemMat=new THREE.MeshStandardMaterial({color:0x5ff5ff,emissive:0x12a9c7,emissiveIntensity:1.8,metalness:.3,roughness:.2});for(let i=0;i<12;i++){let a=i/12*6.28+.3,r=10+(i%3)*6,x=Math.cos(a)*r,z=Math.sin(a)*r,g=new THREE.Mesh(new THREE.OctahedronGeometry(.62),gemMat);g.position.set(x,height(x,z)+1.4,z);g.castShadow=true;scene.add(g);gems.push(g)}
let score=0,vy=0,grounded=true,camAngle=0,move={x:0,y:0},started=false;const scoreEl=document.querySelector('#score'),msg=document.querySelector('#msg');
function toast(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>msg.style.opacity=0,1500)}
function jump(){if(grounded){vy=8;grounded=false}}document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#turn').addEventListener('pointerdown',e=>{e.preventDefault();camAngle+=1.05});
let stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),sid=null;function moveStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=40;if(l>m){x*=m/l;y*=m/l}knob.style.transform=`translate(${x}px,${y}px)`;move={x:x/m,y:y/m}}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)moveStick(e)});function stop(e){if(e.pointerId===sid){sid=null;move={x:0,y:0};knob.style.transform='translate(0,0)'}}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.035),t=clock.elapsedTime;gems.forEach((g,i)=>{g.rotation.y+=dt;g.position.y=height(g.position.x,g.position.z)+1.4+Math.sin(t*2+i)*.17});
if(started){let x=move.x,z=move.y;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;if(keys.w||keys.arrowup)z=-1;if(keys.s||keys.arrowdown)z=1;let f=new THREE.Vector3(Math.sin(camAngle),0,Math.cos(camAngle)),r=new THREE.Vector3(f.z,0,-f.x),dir=r.multiplyScalar(x).add(f.multiplyScalar(z));if(dir.lengthSq()>.01){dir.normalize();player.position.x+=dir.x*7*dt;player.position.z+=dir.z*7*dt;player.rotation.y=Math.atan2(dir.x,dir.z)}let d=Math.hypot(player.position.x,player.position.z);if(d>35){player.position.x*=35/d;player.position.z*=35/d}vy-=19*dt;player.position.y+=vy*dt;let h=height(player.position.x,player.position.z);if(player.position.y<=h){player.position.y=h;vy=0;grounded=true}
for(let i=gems.length-1;i>=0;i--){if(gems[i].position.distanceTo(new THREE.Vector3(player.position.x,player.position.y+1,player.position.z))<1.5){scene.remove(gems[i]);gems.splice(i,1);score++;scoreEl.textContent=`💎 ${score} / 12`;toast(score===12?'جمعت كل البلورات! 🎉':'بلورة جديدة! 💎')}}}
let target=new THREE.Vector3(player.position.x,player.position.y+1,player.position.z),offset=new THREE.Vector3(Math.sin(camAngle)*9,5.5,Math.cos(camAngle)*9);camera.position.lerp(target.clone().add(offset),.1);camera.lookAt(target);renderer.render(scene,camera)}
document.querySelector('#play').onclick=()=>{started=true;document.querySelector('#start').style.display='none'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});camera.position.set(0,7,10);camera.lookAt(0,1,0);animate();
</script></body></html>
